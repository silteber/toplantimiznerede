<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kadıköy ilçe</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fde8de;
            --ink: #2a0e00;
            --ink-muted: #7a4020;
            --ink-faint: #e0b09a;
            --paper: #fef0eb;
            --paper-dark: #f5ddd0;
            --red: #d62828;
            --green: #1a6a2a;
            --orange: #d44000;
            --blue: #1a3a6b;
            --yellow: #d44000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(0,0,0,0.04) 27px, rgba(0,0,0,0.04) 28px);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .newspaper {
            width: 100%;
            max-width: 580px;
            background: var(--paper);
            border: 2px solid var(--ink);
            box-shadow: 5px 5px 0 var(--ink);
            animation: slideIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes slideIn {
            from { opacity:0; transform:translateY(16px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Masthead */
        .masthead {
            border-bottom: 3px double var(--ink);
            padding: 16px 20px 12px;
            text-align: center;
        }
        .masthead-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .masthead-date {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .masthead-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .masthead-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            color: var(--ink-muted);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .masthead-rule { height:1px; background:var(--ink); margin-top:10px; }

        /* Ticker */
        .ticker {
            background: var(--ink);
            color: var(--paper);
            padding: 5px 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            letter-spacing: 0.08em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .ticker-dot {
            display: inline-block;
            width:6px; height:6px;
            border-radius:50%;
            background: #f5c842;
            margin-right: 6px;
            vertical-align: middle;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

        /* Content */
        .content { padding: 20px 20px 16px; }

        /* Headline block */
        .headline-block {
            border-bottom: 2px solid var(--ink);
            padding-bottom: 16px;
            margin-bottom: 0;
        }
        .kicker {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--orange);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .kicker::after { content:''; flex:1; height:1px; background:var(--orange); opacity:0.25; }

        .headline {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.0;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            transition: color 0.4s;
        }
        .headline.durum-burodayiz  { color: var(--green); }
        .headline.durum-tartismali { color: var(--orange); }
        .headline.durum-online     { color: var(--red); }
        .headline.durum-yok        { color: var(--blue); }

        .deck {
            font-size: 0.95rem;
            color: var(--ink-muted);
            line-height: 1.55;
            border-left: 3px solid var(--ink-faint);
            padding-left: 12px;
            min-height: 2.2em;
        }

        .score-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
        }
        .score-lbl {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-muted);
            white-space: nowrap;
        }
        .score-bar-wrap {
            flex:1;
            height: 7px;
            background: var(--paper-dark);
            border: 1px solid var(--ink-faint);
            overflow: hidden;
        }
        .score-bar-inner {
            height: 100%;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.22,1,0.36,1), background 0.8s;
        }
        .score-num {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* Columns */
        .columns {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            border-top: 1px solid var(--ink-faint);
            border-bottom: 2px solid var(--ink);
        }
        .col-item {
            padding: 12px 8px;
            border-right: 1px solid var(--ink-faint);
            text-align: center;
        }
        .col-item:last-child { border-right: none; }
        .col-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.53rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-muted);
            display: block;
            margin-bottom: 4px;
        }
        .col-icon { font-size: 1.2rem; display: block; margin-bottom: 3px; }
        .col-val {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            display: block;
        }
        .col-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            color: var(--ink-muted);
            display: block;
            margin-top: 2px;
        }

        /* Gazete */
        .gazete-section {
            border-top: 1px solid var(--ink-faint);
            padding: 14px 0 0;
        }
        .gazete-kicker {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .gazete-btn {
            background: none;
            border: 1px solid var(--ink-faint);
            cursor: pointer;
            padding: 3px 10px;
            font-size: 0.65rem;
            font-family: 'Space Mono', monospace;
            color: var(--ink-muted);
            transition: all 0.15s;
            display: inline-block;
        }
        .gazete-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
        .gazete-btn.spinning { animation: spinOnce 0.5s ease; }
        @keyframes spinOnce { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

        .gazete-link { display:block; text-decoration:none; color:inherit; }
        .gazete-link:hover .gazete-title-txt { text-decoration: underline; }
        .gazete-title-txt {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--ink);
            margin-bottom: 4px;
            display: block;
        }
        .gazete-src {
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            color: var(--ink-muted);
        }
        .gazete-loading {
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            color: var(--ink-muted);
        }

        /* Footer */
        .footer-bar {
            background: var(--paper-dark);
            border-top: 2px solid var(--ink);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-txt {
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            color: var(--ink-muted);
        }
        .live-dot {
            display: inline-block;
            width:5px; height:5px;
            border-radius:50%;
            background: var(--ink-faint);
            margin-right:5px;
            vertical-align: middle;
            transition: background 0.3s;
        }
        .live-dot.on { background:var(--green); box-shadow: 0 0 5px var(--green); }

        /* Particles */
        .particle-container {
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:0; overflow:hidden;
        }
        .raindrop {
            position:absolute; width:1px;
            background:linear-gradient(transparent, rgba(26,50,100,0.35));
            animation:fall linear infinite; opacity:0;
        }
        @keyframes fall {
            0%{transform:translateY(-20px);opacity:0} 10%{opacity:1}
            90%{opacity:1} 100%{transform:translateY(100vh);opacity:0}
        }
        .snowflake {
            position:absolute; color:rgba(26,50,100,0.3); font-size:12px;
            animation:snowfall linear infinite;
        }
        @keyframes snowfall {
            0%{transform:translateY(-20px) rotate(0deg);opacity:0} 10%{opacity:1}
            90%{opacity:1} 100%{transform:translateY(100vh) rotate(360deg);opacity:0}
        }

        @media (max-width: 480px) {
            .masthead-name { font-size:1.6rem; }
            .headline { font-size:2rem; }
            .content { padding:14px 14px 12px; }
            .footer-bar { padding:7px 14px; }
            .col-val { font-size:0.95rem; }
        }
    </style>
</head>
<body>

<div class="particle-container" id="particles"></div>

<div class="newspaper">

    <div class="masthead">
        <div class="masthead-top">
            <span class="masthead-date" id="bugun-tarih">—</span>
            <span class="masthead-date">istanbul, türkiye</span>
        </div>
        <div class="masthead-name">kadıköy ilçe</div>
        <div class="masthead-sub">toplantı durum bülteni</div>
        <div class="masthead-rule"></div>
    </div>

    <div class="ticker">
        <span><span class="ticker-dot"></span><span id="ticker-text">yükleniyor...</span></span>
        <span id="ticker-right">—</span>
    </div>

    <div class="content">

        <div class="headline-block">
            <div class="kicker" id="kicker-text">bu hafta</div>
            <div class="headline" id="main-headline">yükleniyor...</div>
            <div class="deck" id="main-deck">veriler çekiliyor...</div>
            <div class="score-row">
                <span class="score-lbl">büro skoru</span>
                <div class="score-bar-wrap">
                    <div class="score-bar-inner" id="score-bar"></div>
                </div>
                <span class="score-num" id="score-num">—</span>
            </div>
        </div>

        <div class="columns">
            <div class="col-item">
                <span class="col-icon" id="hava-icon">🌡️</span>
                <span class="col-label">hava</span>
                <span class="col-val" id="hava-val">—</span>
                <span class="col-sub" id="hava-sub"></span>
            </div>
            <div class="col-item">
                <span class="col-icon">🌡️</span>
                <span class="col-label">sıcaklık</span>
                <span class="col-val" id="derece-val">—</span>
                <span class="col-sub" id="derece-sub"></span>
            </div>
            <div class="col-item">
                <span class="col-icon">⚽</span>
                <span class="col-label">kadıköy maçı</span>
                <span class="col-val" id="mac-val">—</span>
                <span class="col-sub">lig bitti şükür</span>
            </div>
        </div>

        <div class="gazete-section">
            <div class="gazete-kicker">
                <span>📰 günün yazısı — gazete nisan</span>
                <button class="gazete-btn" id="gazete-btn" onclick="gazeteyiYukle()">↻ başka</button>
            </div>
            <div id="gazete-icerik">
                <div class="gazete-loading">yazı aranıyor...</div>
            </div>
        </div>

    </div>

    <div class="footer-bar">
        <div class="footer-txt">
            <span class="live-dot" id="live-dot"></span>
            <span id="update-text">güncelleniyor...</span>
        </div>
        <div class="footer-txt" id="next-info"></div>
    </div>

</div>

<script>
const API_KEY = '613219e556123f0b9188976e6fc6e418';

const MAC_TARIHLERI = [
    "2026-02-05","2026-02-09","2026-02-22",
    "2026-03-08","2026-03-18","2026-04-05","2026-04-19"
];

const HAVA_TR  = { Clear:'güneşli', Clouds:'bulutlu', Rain:'yağışlı', Drizzle:'çiseleme', Thunderstorm:'fırtına', Snow:'karlı', Mist:'sisli', Fog:'yoğun sis', Haze:'puslu' };
const HAVA_ICO = { Clear:'☀️', Clouds:'☁️', Rain:'🌧️', Drizzle:'🌦️', Thunderstorm:'⛈️', Snow:'❄️', Mist:'🌫️', Fog:'🌫️', Haze:'🌫️' };
const GUN_ADI  = ['pazar','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi'];

function hedefGun(tarih) {
    return tarih >= new Date("2026-03-08") ? 1 : 4;
}

function sonrakiTopla(simdi) {
    const d = new Date(simdi);
    for (let i = 1; i <= 14; i++) {
        d.setDate(d.getDate() + 1);
        if (d.getDay() === hedefGun(d)) return new Date(d);
    }
    return null;
}

function buroPuani(main, derece, yagis) {
    let p = 100;
    if (derece < -5) p -= 40; else if (derece < 0) p -= 25; else if (derece < 5) p -= 10;
    else if (derece > 38) p -= 20; else if (derece > 33) p -= 10;
    if (main === 'Thunderstorm') p -= 50;
    else if (main === 'Snow') p -= 35;
    else if (main === 'Rain') { p -= yagis > 5 ? 40 : yagis > 2 ? 25 : 15; }
    else if (main === 'Drizzle') p -= 10;
    else if (main === 'Fog') p -= 15;
    return Math.max(0, Math.min(100, p));
}

function forecastFiltrele(list, hedefTarih) {
    const str = hedefTarih.toLocaleDateString('en-CA');
    const f   = list.filter(i => {
        const d = new Date(i.dt * 1000);
        return d.toLocaleDateString('en-CA') === str && d.getHours() >= 17 && d.getHours() <= 22;
    });
    if (!f.length) return null;
    const derece = Math.round(f.reduce((s,i) => s + i.main.temp, 0) / f.length);
    const yagis  = f.reduce((s,i) => s + (i.rain ? (i.rain['3h'] || 0) : 0), 0);
    const main   = f.map(i => i.weather[0].main)
        .sort((a,b) => f.filter(x=>x.weather[0].main===b).length - f.filter(x=>x.weather[0].main===a).length)[0];
    return { derece, yagis, main };
}

function jsonp(url) {
    return new Promise((res, rej) => {
        const cb = 'owm_' + Date.now();
        const s  = document.createElement('script');
        const t  = setTimeout(() => { delete window[cb]; s.remove(); rej(new Error('timeout')); }, 8000);
        window[cb] = d => { clearTimeout(t); delete window[cb]; s.remove(); res(d); };
        s.src = url + '&callback=' + cb;
        s.onerror = () => { clearTimeout(t); rej(new Error('error')); };
        document.head.appendChild(s);
    });
}

function animasyonYap(tip) {
    const c = document.getElementById('particles');
    c.innerHTML = '';
    if (tip === 'rain') {
        for (let i = 0; i < 50; i++) {
            const d = document.createElement('div');
            d.className = 'raindrop';
            d.style.cssText = `left:${Math.random()*100}%;height:${Math.random()*14+8}px;animation-duration:${Math.random()*0.6+0.5}s;animation-delay:${Math.random()*2}s;`;
            c.appendChild(d);
        }
    } else if (tip === 'snow') {
        for (let i = 0; i < 35; i++) {
            const f = document.createElement('div');
            f.className = 'snowflake'; f.textContent = '❄';
            f.style.cssText = `left:${Math.random()*100}%;font-size:${Math.random()*8+7}px;animation-duration:${Math.random()*3+3}s;animation-delay:${Math.random()*4}s;`;
            c.appendChild(f);
        }
    }
}

function scoreGoster(puan) {
    const renk = puan >= 70 ? '#2d6a2d' : puan >= 40 ? '#c44b00' : '#d62828';
    setTimeout(() => {
        document.getElementById('score-bar').style.width = puan + '%';
        document.getElementById('score-bar').style.background = renk;
    }, 300);
    const n = document.getElementById('score-num');
    n.textContent = puan + '/100';
    n.style.color = renk;
}

async function sistemiGuncelle() {
    const simdi    = new Date();
    const bugunISO = simdi.toLocaleDateString('en-CA');
    const hg       = hedefGun(simdi);
    const bugunMu  = simdi.getDay() === hg;
    const sonraki  = sonrakiTopla(simdi);
    const sonrakiISO = sonraki ? sonraki.toLocaleDateString('en-CA') : null;

    document.getElementById('bugun-tarih').textContent =
        simdi.toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    try {
        let main, derece, yagis, kaynak;

        if (bugunMu) {
            const d = await jsonp(`https://api.openweathermap.org/data/2.5/weather?q=Istanbul&appid=${API_KEY}&units=metric`);
            main = d.weather[0].main; derece = Math.round(d.main.temp);
            yagis = d.rain ? (d.rain['1h'] || 0) : 0; kaynak = 'anlık';
            document.getElementById('kicker-text').textContent = 'bugünkü durum';
        } else {
            const d = await jsonp(`https://api.openweathermap.org/data/2.5/forecast?q=Istanbul&appid=${API_KEY}&units=metric`);
            const t = forecastFiltrele(d.list, sonraki);
            if (t) {
                main = t.main; derece = t.derece; yagis = t.yagis; kaynak = 'tahmin';
                document.getElementById('kicker-text').textContent =
                    `${GUN_ADI[sonraki.getDay()]} için tahmin (17-22)`;
            } else {
                const d2 = await jsonp(`https://api.openweathermap.org/data/2.5/weather?q=Istanbul&appid=${API_KEY}&units=metric`);
                main = d2.weather[0].main; derece = Math.round(d2.main.temp);
                yagis = d2.rain ? (d2.rain['1h'] || 0) : 0; kaynak = 'anlık';
                document.getElementById('kicker-text').textContent = 'anlık hava';
            }
        }

        const hedefISO = bugunMu ? bugunISO : sonrakiISO;
        const macVar   = MAC_TARIHLERI.includes(hedefISO);
        const puan     = buroPuani(main, derece, yagis);
        const efektif  = macVar ? Math.min(puan, 55) : puan;

        document.getElementById('hava-icon').textContent  = HAVA_ICO[main] || '🌡️';
        document.getElementById('hava-val').textContent   = HAVA_TR[main] || main;
        document.getElementById('hava-sub').textContent   = kaynak;
        document.getElementById('derece-val').textContent = derece + '°C';
        document.getElementById('derece-sub').textContent = derece < 5 ? 'soğuk!' : derece > 32 ? 'sıcak!' : 'normal';
        document.getElementById('mac-val').textContent    = macVar ? 'var ⚠️' : 'yok';

        scoreGoster(efektif);

        document.getElementById('ticker-text').textContent =
            `büro skoru: ${efektif}/100  ·  ${HAVA_TR[main]||main}  ·  ${derece}°C`;
        document.getElementById('ticker-right').textContent = macVar ? '⚽ maç var' : '✓ maç yok';

        const headline = document.getElementById('main-headline');
        const deck     = document.getElementById('main-deck');
        headline.className = 'headline';

        if (!bugunMu) {
            const gunFarki   = sonraki ? Math.ceil((sonraki - simdi) / 86400000) : '?';
            const sonrakiAdi = sonraki ? GUN_ADI[sonraki.getDay()] : '?';
            headline.classList.add('durum-yok');
            headline.textContent = 'bugün toplantı yok.';
            deck.textContent = `${sonrakiAdi} toplantısına ${gunFarki} gün kaldı. şimdiki tahmine göre: ${efektif >= 70 ? 'bürodayız 🟢' : efektif >= 40 ? 'tartışmalı 🟡' : 'online olabiliriz 🔴'}`;
            document.getElementById('next-info').textContent =
                sonraki ? `sonraki: ${GUN_ADI[sonraki.getDay()]} ${sonraki.toLocaleDateString('tr-TR')}` : '';
            animasyonYap(main === 'Rain' || main === 'Drizzle' ? 'rain' : main === 'Snow' ? 'snow' : '');
        } else if (efektif >= 70) {
            headline.classList.add('durum-burodayiz');
            headline.textContent = 'bürodayız.';
            deck.textContent = "19:30'da görüşürüz — önden gelen çay kahve demlesin.";
            animasyonYap('');
        } else if (efektif >= 40) {
            headline.classList.add('durum-tartismali');
            headline.textContent = 'tartışmalı.';
            deck.textContent = macVar && puan > 55
                ? 'hava fena değil ama maç var... önemli maç değilse büro diyelim.'
                : 'hava kötü ama şekerden değiliz, erimeyiz... herhalde?';
            animasyonYap('rain');
        } else {
            headline.classList.add('durum-online');
            headline.textContent = 'online olabiliriz.';
            deck.textContent = macVar && puan < 40
                ? "hava kötü + maç var. kadıköy'e girilmez. zoom diyelim mi?"
                : main === 'Snow' ? 'kar yağıyor. evimiz var, zoom açalım.'
                : 'hava çok kötü. zoom açalım.';
            animasyonYap(main === 'Snow' ? 'snow' : 'rain');
        }

    } catch(e) {
        document.getElementById('main-headline').textContent = 'bağlantı hatası';
        document.getElementById('main-deck').textContent = 'hava durumu verileri çekilemedi.';
    }

    const saat = simdi.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('update-text').textContent = `son güncelleme: ${saat}`;
    const dot = document.getElementById('live-dot');
    dot.classList.add('on');
    setTimeout(() => dot.classList.remove('on'), 2000);
}

// ── Gazete ──
async function gazeteyiYukle() {
    const btn = document.getElementById('gazete-btn');
    btn.classList.remove('spinning');
    void btn.offsetWidth; // reflow — animasyonu sıfırla
    btn.classList.add('spinning');

    document.getElementById('gazete-icerik').innerHTML = '<div class="gazete-loading">yazı aranıyor...</div>';

    try {
        const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.gazetenisan.net');
        const res = await fetch(url);
        if (!res.ok) throw new Error('fetch failed');
        const html = await res.text();
        const doc  = new DOMParser().parseFromString(html, 'text/html');

        let yazilar = [];

        // 1. Önce article/entry içindeki başlıkları dene
        doc.querySelectorAll('article h2 a, article h3 a, .entry-title a, h2.entry-title a').forEach(el => {
            const b = el.textContent.trim();
            const l = el.getAttribute('href') || '';
            if (b.length > 10 && b.length < 180 && l.includes('gazetenisan')) yazilar.push({ baslik:b, link:l });
        });

        // 2. Genel h2/h3
        if (!yazilar.length) {
            doc.querySelectorAll('h2 a, h3 a').forEach(el => {
                const b = el.textContent.trim();
                const l = el.getAttribute('href') || '';
                if (b.length > 10 && b.length < 180 && l.includes('gazetenisan')) yazilar.push({ baslik:b, link:l });
            });
        }

        // 3. Geniş tarama
        if (!yazilar.length) {
            doc.querySelectorAll('a').forEach(el => {
                const b = el.textContent.trim();
                const l = el.getAttribute('href') || '';
                const fullL = l.startsWith('/') ? 'https://www.gazetenisan.net' + l : l;
                if (b.length > 20 && b.length < 180 && fullL.includes('gazetenisan')
                    && !fullL.includes('category') && !fullL.includes('tag') && !fullL.includes('author')) {
                    yazilar.push({ baslik:b, link:fullL });
                }
            });
        }

        yazilar = yazilar.filter((y,i,a) => a.findIndex(x => x.link === y.link) === i);
        if (!yazilar.length) throw new Error('boş');

        const ilkBes  = yazilar.slice(0, 5);
        const secilen = ilkBes[Math.floor(Math.random() * ilkBes.length)];

        document.getElementById('gazete-icerik').innerHTML = `
            <a class="gazete-link" href="${secilen.link}" target="_blank">
                <span class="gazete-title-txt">${secilen.baslik}</span>
                <span class="gazete-src">gazetenisan.net · okumak için dokun</span>
            </a>
        `;
    } catch(e) {
        document.getElementById('gazete-icerik').innerHTML =
            '<div class="gazete-loading">yazı çekilemedi — biraz sonra tekrar dene 😞</div>';
    }
}

sistemiGuncelle();
setInterval(sistemiGuncelle, 10 * 60 * 1000);
gazeteyiYukle();
</script>
